<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Confirm your Regrettamine account</title></head>
<body style="margin:0;padding:0;background:#F7F4FF;font-family:'DM Sans',Helvetica,Arial,sans-serif;color:#14112B;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F7F4FF;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border-radius:24px;padding:36px 32px;border:1px solid #ECE9F5;">
        <tr><td>
          <p style="margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6C3BFF;">Regrettamine</p>
          <h1 style="margin:0 0 12px;font-size:28px;line-height:1.15;font-weight:800;">Confirm your email</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#4D4868;">Use the button below to finish creating your account. The link expires soon.</p>
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#6C3BFF;color:#ffffff;text-decoration:none;font-weight:700;font-size:16px;border-radius:14px;padding:14px 22px;">Confirm email</a>
          <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#8C88A3;">If you didn't sign up, you can ignore this email.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
