name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      rollout:
        description: 'Full all-firms build and deploy. Only when Alex says roll out.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Deploys stay on group "pages" and are not cancelled.
# Each pull request has its own group, so a PR check does not cancel another PR or a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  rollout-required:
    if: github.event_name == 'workflow_dispatch' && inputs.rollout != true && inputs.rollout != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a full build
        run: |
          echo 'A full all-firms build runs only when rollout is true (Alex says roll out).'
          exit 1

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.rollout == true || inputs.rollout == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build launch site (published to regretamin.com)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LAB_ONLY: ${{ (github.event_name == 'workflow_dispatch' && (inputs.rollout == true || inputs.rollout == 'true')) && '0' || '1' }}
        run: |
          echo "LAB_ONLY=$LAB_ONLY"
          python3 launch/build.py
          test -f site-launch/CNAME
      - name: Keep launch site for the Cloudflare preview
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.rollout == true || inputs.rollout == 'true'))
        uses: actions/upload-artifact@v4
        with:
          name: site-launch
          path: site-launch

  test:
    if: github.event_name != 'workflow_dispatch' || inputs.rollout == true || inputs.rollout == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: regrettamine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Migrate and test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/regrettamine
        run: |
          # Supabase keeps pgcrypto in the "extensions" schema; plain Postgres needs it created first.
          PGPASSWORD=postgres psql -h localhost -U postgres -d regrettamine -c 'create schema if not exists extensions; create extension if not exists pgcrypto schema extensions;'
          CI_SEED=1 python3 scripts/migrate.py
          python3 -m pytest -q

  # Cloudflare Pages is the live site (regretamin.com). Runs only when CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID secrets exist. A push builds the 10 lab firms. rollout=true builds every firm.
  cloudflare-preview:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.rollout == true || inputs.rollout == 'true'))
    needs: [build, test]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LAB_ONLY: ${{ (github.event_name == 'workflow_dispatch' && (inputs.rollout == true || inputs.rollout == 'true')) && '0' || '1' }}
      REGRET_FIRMS: a16z,y-combinator,sequoia,lightspeed,generalcatalyst,plugandplay,accel,greenoaks,khosla-ventures,mio-partners
    steps:
      - name: Checkout
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - name: Get launch site
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: site-launch
          path: site-launch
      - name: Deploy preview, then production only if a non-lab firm still loads
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: launch
        run: bash ../scripts/pages_deploy.sh
      - name: Setup Node
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check live fund pages after hydration
        if: env.CLOUDFLARE_API_TOKEN != ''
        timeout-minutes: 5
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          # The runner already has the shared libraries. --with-deps apt-upgrades them and
          # restarts services, which took about 11 minutes on 2026-10-27. The page check is ~10s.
          npx playwright install chromium
          node scripts/check_live_reports.mjs
